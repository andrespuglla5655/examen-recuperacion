name: CI/CD Pipeline for Examen Recuperacion

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ puglla ]
  pull_request:
    branches: [ puglla ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        python -m pytest tests/ -v


  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/puglla'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Push Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./puglla
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/examen-recuperacion:puglla-3.0.0


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/puglla'
    steps:
    - uses: actions/checkout@v3

    # 1️⃣ Limpiar directorio en VPS (soluciona "is a directory")
    - name: Clean wrong directory on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          if [ -d "/home/${{ secrets.VPS_USER }}/puglla.yml" ]; then
            echo "Found directory named puglla.yml, removing it..."
            rm -rf /home/${{ secrets.VPS_USER }}/puglla.yml
          fi

    # 2️⃣ Subir archivo del stack actualizado
    - name: Copy stack file to VPS (SCP)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "puglla.yml"
        target: "/home/${{ secrets.VPS_USER }}/puglla.yml"

    # 3️⃣ Verificar que sí es archivo y no carpeta
    - name: Validate stack file on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          if [ -d "/home/${{ secrets.VPS_USER }}/puglla.yml" ]; then
            echo "ERROR: puglla.yml is still a directory!"
            exit 1
          fi
          if [ ! -f "/home/${{ secrets.VPS_USER }}/puglla.yml" ]; then
            echo "ERROR: puglla.yml file not found!"
            exit 1
          fi
          echo "puglla.yml validated: correct file."

    # 4️⃣ Realizar el deploy
    - name: Deploy on VPS via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker pull ghcr.io/${{ github.repository_owner }}/examen-recuperacion:puglla-3.0.0
          docker stack deploy -c /home/${{ secrets.VPS_USER }}/puglla.yml puglla