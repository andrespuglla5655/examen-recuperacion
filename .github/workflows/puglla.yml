name: CI/CD Pipeline for Practica1

on:
  push:
    branches: [ puglla ]
  pull_request:
    branches: [ puglla ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/puglla'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
        
    - name: Build the Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: ghcr.io/${{ github.repository_owner }}/practica1:puglla-1.0.5
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Tag & Push Image to GHCR
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/practica1:puglla-1.0.5
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/puglla'
    steps:
    - uses: actions/checkout@v3
    
    - name: Copy stack.yml to VPS (SCP)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/stack.yml"
        
    - name: Verify stack.yml copy on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          if [ -f "/home/${{ secrets.VPS_USER }}/stack.yml" ]; then
            echo "stack.yml successfully copied to VPS"
          else
            echo "ERROR: stack.yml not found on VPS"
            exit 1
          fi
          
    - name: Deploy on VPS via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "Pulling Docker image..."
          docker pull ghcr.io/${{ github.repository_owner }}/practica1:puglla-1.0.5
          
          echo "Deploying with Docker Swarm..."
          docker stack deploy -c stack.yml puglla
          
          echo "Deployment completed successfully!"